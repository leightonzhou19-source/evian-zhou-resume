<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e8ded0">
  <meta name="description" content="周艺芸 Evian Zhou 的交互式个人简历。7 年本地生活运营与 1 年 AI 修图创意运营经历。">
  <title>周艺芸 Evian Zhou · 个人简历</title>
  <link rel="stylesheet" href="./style.css?v=20261026-jianying">
  <script defer src="./script.js?v=20261026-jianying"></script>
  <script defer src="./i18n.js?v=20261026-jianying"></script>
</head>
<body>
  <div class="language-switch" role="group" aria-label="语言切换">
    <button type="button" data-language="zh" aria-pressed="true">中文</button>
    <button type="button" data-language="en" aria-pressed="false">EN</button>
  </div>
  <div class="site-shell" id="siteShell">
    <aside class="side-panel" aria-label="站点说明与目录">
      <div class="side-content reveal-side">
        <div class="side-heading">
          <span>EVIAN ZHOU<br>RESUME</span>
          <span class="tiny-mark">© 2026</span>
        </div>
        <p class="side-subtitle">WHERE IDEAS MEET NEW BEGINNINGS.</p>
        <div class="side-rule"></div>
        <div class="status-block">
          <span class="micro-label">WHY NOT MODE</span>
          <span class="status-dot"></span><span>CURIOSITY ACTIVE</span>
        </div>
        <div class="side-rule"></div>
        <div class="legend">
          <div class="micro-label">* BOARD LEGEND <span>↗</span></div>
          <button data-open="profile"><span>02</span><span>Clear File</span><span>Experience</span></button>
          <button data-open="about"><span>01</span><span>Key Tag</span><span>About</span></button>
          <button data-open="skills"><span>04</span><span>Black Badge</span><span>Skills</span></button>
          <button data-open="works"><span>03</span><span>ID Card</span><span>Works</span></button>
          <button data-open="contact"><span>05</span><span>Air Mail Card</span><span>Contact</span></button>
        </div>
        <div class="side-rule"></div>
        <div class="interface-note">
          <span class="micro-label">* OBJECT INTERFACE</span>
          <p>↗ Hover for details<br>◉ Click to unfold</p>
        </div>
        <div class="side-bottom">
          <strong>IDEAS / OBJECTS<br>STORIES &<br>IMAGE SYSTEMS.</strong>
          <div class="side-foot">
            <div class="qr-art" aria-hidden="true"></div>
            <p>CONNECT &amp; EXPLORE<br><small>Replace with your story.</small></p>
          </div>
        </div>
      </div>
    </aside>

    <main class="pegboard" aria-label="交互式个人简历洞洞板">
      <div class="pegboard-sheen" aria-hidden="true"></div>
      <div class="intro" id="intro" aria-hidden="true"><div class="intro-word">EVIAN<br><span>ZHOU</span></div><div class="intro-sub">RESUME</div></div>

      <button class="object works-file drop drop-1" data-open="profile" aria-label="打开成长履历">
        <span class="hook"><i></i></span>
        <span class="file-clip" aria-hidden="true"></span>
        <span class="file-inner">
          <span class="file-index">02</span>
          <strong>EXPERIENCE</strong>
          <em>成长履历</em>
          <span class="file-rule"></span>
          <span class="file-copy">7 years in local life.<br>1 year in AI creative<br>operations.</span>
          <span class="file-mini">□</span>
          <span class="project-line"><b>AI</b><span>AI BUILDER<small>2026.07 — NOW</small></span><i class="thumbnail thumb-1"></i></span>
          <span class="project-line"><b>01</b><span>字节跳动<small>2026.04 — 07</small></span><i class="thumbnail thumb-2"></i></span>
          <span class="project-line"><b>02</b><span>美团<small>2023.12 — 2026.01</small></span><i class="thumbnail thumb-3"></i></span>
          <span class="project-line"><b>03</b><span>阿里巴巴本地生活<small>2019.12 — 2023.08</small></span><i class="thumbnail thumb-4"></i></span>
          <span class="project-line"><b>04</b><span>VERSA<small>2018.09 — 2019.12</small></span><i class="thumbnail thumb-6"></i></span>
          <span class="project-line"><b>05</b><span>DOLCE &amp; GABBANA<small>2015.07 — 2018.09</small></span><i class="thumbnail thumb-5"></i></span>
        </span>
      </button>

      <button class="object key-tag drop drop-2" data-open="about" aria-label="打开关于我">
        <span class="hook"><i></i></span>
        <span class="key-head" aria-hidden="true">✦</span>
        <span class="tag-body">
          <span class="tag-index">01 /</span>
          <strong>ABOUT ME</strong>
          <em>个人简介</em>
          <span class="tag-small">7 years in local life.<br>1 year in AI creative<br>operations.</span>
          <span class="tag-arrow">↗</span>
        </span>
      </button>

      <button class="object skills-tag drop drop-3" data-open="skills" aria-label="打开技能标签">
        <span class="hook"><i></i></span>
        <span class="black-tag">
          <span class="black-index">04 SKILLS</span>
          <em>技能标签</em>
          <span class="skill-pills"><i>codex</i><i>SQL</i><i>日语 N2</i><i>flova</i><i>从0到1</i><i>剪映</i></span>
          <span class="black-bottom">EXPLORE MORE ↗</span>
        </span>
      </button>

      <button class="object id-card drop drop-4" data-open="works" aria-label="打开个人作品">
        <span class="hook"><i></i></span>
        <span class="id-inner">
          <span class="id-top"><span>03 PERSONAL WORKS<br><small>个人作品</small></span><span>作品<br>FILE</span></span>
          <span class="id-middle"><span class="avatar-placeholder">W</span><span><strong>PROJECT FILE</strong><small>Personal works<br>创意项目</small></span></span>
          <span class="id-bottom">VIEW WORKS <span>→</span></span>
        </span>
      </button>

      <button class="object contact-card drop drop-5" data-open="contact" aria-label="打开联系方式">
        <span class="hook"><i></i></span>
        <span class="airmail">
          <span class="mail-top"><span>05<br><strong>CONTACT</strong><em>联系方式</em></span><span class="stamp">✷<small>POST</small></span></span>
          <span class="mail-line">↗ &nbsp; 微信 esperanza19</span>
          <span class="mail-line">↗ &nbsp; 手机 13585963216</span>
          <span class="mail-line">↗ &nbsp; bonjour.bio/mp84ct</span>
          <span class="mail-line">↗ &nbsp; GitHub / leightonzhou19-source</span>
          <span class="barcode">▥▥▥▥▥▥▥▥▥▥▥▥</span>
        </span>
      </button>

      <div class="board-controls">
        <span class="zoom-readout">100%</span>
        <button id="replay" aria-label="重播入场动画" title="重播入场动画">↺ REPLAY</button>
      </div>
      <div class="side-icons" aria-label="快捷操作"><button data-open="about" aria-label="关于">＋</button><button data-open="contact" aria-label="联系">✳</button></div>
    </main>
  </div>

  <div class="modal-layer" id="modalLayer" hidden>
    <div class="modal-backdrop" data-close></div>
    <section class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-modal" data-close aria-label="关闭弹窗">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
</body>
</html>
